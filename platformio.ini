; ============================================================
;  DINAMIC BYB NORTH — firmware ESP32
;  Placa: ESP32-WROOM-32D (genérica "esp32dev")
;
;  Compilar:      python -m platformio run
;  Subir:         python -m platformio run -t upload
;  Monitor serie: python -m platformio device monitor   (115200 baudios)
;
;  Nota: si "pio" no responde en su terminal use  python -m platformio
;  (el lanzador pio.exe de Python 3.13 puede quedarse colgado).
; ============================================================
[platformio]
src_dir = .
build_dir = C:/Users/Borybor/AppData/Local/Temp/opencode/pio_build
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  links2004/WebSockets@^2.4.1
;  Nota: pio_fix_ar.py (abajo, "pre:") evita un cuelgue de cmd.exe al
;  archivar/enlazar. NO lo borre: sin él la compilación se queda pegada.
extra_scripts =
  pre:pio_fix_ar.py
build_flags =
  -Wall
  -DCORE_DEBUG_LEVEL=1
